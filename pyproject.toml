[project]
name = "losneomrade"
version = "2.0.1-dev"
description = "Calculation of quick-clay release area"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Cristian Godoy", email = "crgo@nve.no" }
]
keywords = ["quick-clay", "landslide", "retrogression", "geotechnical", "NVE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "geopandas",
    "shapely",
    "rasterio",
    "tqdm",
    "requests",
    "Pillow",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
    "ty",
]
docs = [
    "zensical",
]

[project.urls]
"Source" = "https://github.com/cgodoyle/losneomrade"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that hit external APIs (deselect with '-m \"not slow\"')",
]

